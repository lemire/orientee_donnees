{{/* Surcouche : le logo est purement décoratif (le titre du site suit en
     texte), donc alt vide plutôt que « Logo » en anglais. */}}
<h2 class="book-brand">
  <a class="flex align-center" href="{{ cond (not .Site.Home.File) .Sites.Default.Home.RelPermalink .Site.Home.RelPermalink }}">
    {{- with .Site.Params.BookLogo -}}
    <img src="{{ . | relURL }}" alt="" class="book-icon" />
    {{- end -}}
    <span>{{ .Site.Title }}</span>
  </a>
</h2>
