{{/* Surcouche : le logo est purement décoratif (le titre du site suit en
     texte), donc alt vide plutôt que « Logo ». */}}
<div class="book-brand">
  <a class="flex align-center" href="{{ partial "docs/links/home" . }}">
    {{- with .Site.Params.BookLogo -}}
    <img src="{{ . | relURL }}" alt="" />
    {{- end -}}
    <span>{{ .Site.Title }}</span>
  </a>
</div>
