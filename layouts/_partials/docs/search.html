{{/* Surcouche : repère de recherche, étiquette explicite et résultats
     annoncés par une région role="status" (WCAG 4.1.3). role="status"
     n'est pas autorisé sur <ul> : on le porte par un conteneur. */}}
{{- if default true .Site.Params.BookSearch -}}
<div class="book-search hidden" role="search">
  <label for="book-search-input" class="sr-only">{{ partial "docs/text/i18n" "Search" }}</label>
  <input id="book-search-input" type="search" enterkeyhint="search"
    placeholder="Rechercher"
    maxlength="64" />
  <div class="book-search-spinner hidden" aria-hidden="true"></div>
  <div role="status" aria-live="polite" aria-label="Résultats de la recherche">
    <ul id="book-search-results"></ul>
  </div>
</div>
<script>document.querySelector(".book-search").classList.remove("hidden")</script>
{{- end -}}
