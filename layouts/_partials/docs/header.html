{{/* Surcouche : les bascules du menu et du sommaire sont annoncées comme
     telles (le thème les nomme « Menu » / « Table of Contents », ce qui
     ferait doublon avec le nom des repères). */}}
<div class="flex align-center justify-between gap">
  <input type="checkbox" class="toggle" id="menu-control" />
  <label for="menu-control" aria-label="Afficher ou masquer le menu">
    <svg class="book-icon" aria-hidden="true">{{ partial "docs/icon" "menu" }}</svg>
  </label>

  {{ partial "docs/brand" . }}

  {{ if .Param "BookToC" | default true }}
  <input type="checkbox" class="toggle" id="toc-control" />
  <label for="toc-control" aria-label="Afficher ou masquer le sommaire">
    <svg class="book-icon" aria-hidden="true">{{ partial "docs/icon" "toc" }}</svg>
  </label>
  {{ else }}<div></div>{{ end }}
</div>
