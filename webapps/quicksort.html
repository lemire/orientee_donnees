<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri rapide</title>
<style>
  body { margin: 0; padding: 1.5rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f3f4f6; color: #1f2433; display: flex; justify-content: center; }
  main { width: 100%; max-width: 960px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
             overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid #3a4cb8; outline-offset: 2px; }
  button { min-height: 44px; }
</style>
</head>
<body>
<main>
<h1>Tri rapide</h1>
<div id="quickSortApp_controls" style="margin-bottom: 20px;">
    <label for="quickSortApp_pivotStrategy" style="font-size: 16px; margin-right: 10px;">Stratégie de pivot :</label>
    <select id="quickSortApp_pivotStrategy" style="padding: 5px; font-size: 16px; margin-right: 20px;">
      <option value="median">Médiane de trois</option>
      <option value="random">Élément aléatoire</option>
      <option value="last">Dernier élément</option>
      <option value="first">Premier élément</option>
    </select>
    <button id="quickSortApp_startButton" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Lancer le tri</button>
    <button id="quickSortApp_resetButton" style="padding: 10px 20px; font-size: 16px; cursor: pointer; margin-left: 10px;">Réinitialiser</button>
  </div>
    <h2 style="font-size:1rem;margin:16px 0 4px;">Légende</h2>
  <ul style="list-style:none;padding:0;margin:0 0 12px;font-size:0.9rem;">
    <li style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;"><span aria-hidden="true" style="width:18px;height:18px;display:inline-block;background:gray;border:none;"></span>Au repos (aucune bordure)</li>
    <li style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;"><span aria-hidden="true" style="width:18px;height:18px;display:inline-block;background:#c62828;border:3px dotted #000;"></span>En comparaison (bordure pointillée noire)</li>
    <li style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;"><span aria-hidden="true" style="width:18px;height:18px;display:inline-block;background:#1565c0;border:3px solid #000;"></span>En échange (bordure pleine noire)</li>
    <li style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;"><span aria-hidden="true" style="width:18px;height:18px;display:inline-block;background:#2e7d32;border:4px double #000;"></span>Pivot (bordure double noire)</li>
  </ul>
  <p id="quickSortApp_statut" role="status" aria-live="polite" style="min-height:1.5em;font-weight:600;"></p>
<div id="quickSortApp_arrayContainer" role="img" aria-label="Représentation graphique du tri rapide ; l'état de chaque barre est décrit dans la légende ci-dessus." style="display: flex; justify-content: center; align-items: flex-end; height: 300px; gap: 5px;"></div>
  <script>
    (function() {
      /* Double le signal de couleur par un motif de bordure : la couleur
         seule ne doit pas porter l'information (WCAG 1.4.1). */
      const ETATS_BARRE = {
        repos:   { fond: 'gray',    bordure: 'none' },
        compare: { fond: '#c62828', bordure: '3px dotted #000' },
        echange: { fond: '#1565c0', bordure: '3px solid #000' },
        pivot:   { fond: '#2e7d32', bordure: '4px double #000' }
      };
      function appliquerEtat(bar, etat) {
        const e = ETATS_BARRE[etat] || ETATS_BARRE.repos;
        bar.style.backgroundColor = e.fond;
        bar.style.border = e.bordure;
        bar.style.boxSizing = 'border-box';
      }

      const startButton = document.getElementById('quickSortApp_startButton');
      const resetButton = document.getElementById('quickSortApp_resetButton');
      const pivotStrategy = document.getElementById('quickSortApp_pivotStrategy');
      const arrayContainer = document.getElementById('quickSortApp_arrayContainer');
      let array = [];
      let isSorting = false;
      const zoneStatut = document.getElementById('quickSortApp_statut');
      /* Le tri redessine les barres toutes les 100 ms : annoncer chaque
         comparaison noierait l'utilisateur. On n'annonce donc que le
         début et la fin (WCAG 4.1.3). */
      function annoncer(texte) { if (zoneStatut) zoneStatut.textContent = texte; }

      function generateArray() {
        array = Array.from({length: 64}, () => Math.floor(Math.random() * 100) + 10);
        renderArray();
      }

      function renderArray(pivotIndex = -1, comparing = [], swapping = []) {
        arrayContainer.innerHTML = '';
        array.forEach((value, index) => {
          const bar = document.createElement('div');
          bar.style.height = `${value * 2}px`;
          bar.style.width = '20px';
          appliquerEtat(bar, index === pivotIndex ? 'pivot' : swapping.includes(index) ? 'echange' : comparing.includes(index) ? 'compare' : 'repos');
          bar.style.display = 'inline-block';
          arrayContainer.appendChild(bar);
        });
      }

      function getMedianIndex(low, high) {
        const mid = Math.floor((low + high) / 2);
        const values = [
          { value: array[low], index: low },
          { value: array[mid], index: mid },
          { value: array[high], index: high }
        ];
        values.sort((a, b) => a.value - b.value);
        return values[1].index;
      }

      async function partition(low, high) {
        let pivotIndex;
        const strategy = pivotStrategy.value;
        if (strategy === 'first') {
          pivotIndex = low;
        } else if (strategy === 'random') {
          pivotIndex = low + Math.floor(Math.random() * (high - low + 1));
        } else if (strategy === 'median') {
          pivotIndex = getMedianIndex(low, high);
        } else {
          pivotIndex = high;
        }

        const pivot = array[pivotIndex];
        if (pivotIndex !== high) {
          [array[pivotIndex], array[high]] = [array[high], array[pivotIndex]];
          pivotIndex = high;
        }

        renderArray(pivotIndex, [low, high]);
        await new Promise(resolve => setTimeout(resolve, 100));
        let i = low - 1;

        for (let j = low; j < high; j++) {
          renderArray(pivotIndex, [j, i + 1]);
          await new Promise(resolve => setTimeout(resolve, 100));
          if (array[j] <= pivot) {
            i++;
            if (i !== j) {
              [array[i], array[j]] = [array[j], array[i]];
              renderArray(pivotIndex, [], [i, j]);
              await new Promise(resolve => setTimeout(resolve, 100));
            }
          }
        }

        if (i + 1 !== high) {
          [array[i + 1], array[high]] = [array[high], array[i + 1]];
          renderArray(-1, [], [i + 1, high]);
          await new Promise(resolve => setTimeout(resolve, 100));
        }

        return i + 1;
      }

      async function quickSort(low, high) {
        if (low < high) {
          const pi = await partition(low, high);
          await quickSort(low, pi - 1);
          await quickSort(pi + 1, high);
        }
      }

      async function sort() {
        if (isSorting) return;
        isSorting = true;
        annoncer('Tri en cours…');
        startButton.disabled = true;
        startButton.style.cursor = 'not-allowed';

        await quickSort(0, array.length - 1);
        renderArray();

        isSorting = false;
        startButton.disabled = false;
        annoncer('Tri terminé. Les %d valeurs sont en ordre croissant.'.replace('%d', array.length));
        startButton.style.cursor = 'pointer';
      }

      startButton.addEventListener('click', sort);
      resetButton.addEventListener('click', () => {
        if (!isSorting) generateArray();
      });

      generateArray();
    })();
  </script>
</main>
</body>
</html>
